name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    # Signing secrets live in this environment, so the job resolves them from there.
    environment: github_production
    permissions:
      contents: write
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Inject signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
          } >> local.properties

      # Flavor-agnostic: builds devRelease + prodRelease today, and absorbs any flavor added later.
      - name: Assemble the signed release APKs
        run: ./gradlew :app:assembleRelease --stacktrace

      # Names come from AGP's own metadata rather than being hardcoded, and the */release/ glob is
      # what keeps debug variants out.
      - name: Collect the APKs
        id: collect
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/release-apks"
          mkdir -p "$staging"
          for metadata in app/build/outputs/apk/*/release/output-metadata.json; do
            dir="$(dirname "$metadata")"
            build_type="$(basename "$dir")"
            flavor="$(basename "$(dirname "$dir")")"
            version="$(jq -r '.elements[0].versionName' "$metadata")"
            source="$dir/$(jq -r '.elements[0].outputFile' "$metadata")"
            cp "$source" "$staging/alarm-me-$version-$flavor-$build_type.apk"
          done
          echo "staging=$staging" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l "$staging"

      - name: Verify the APKs are signed
        run: |
          set -euo pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in "${{ steps.collect.outputs.staging }}"/*.apk; do
            echo "== $(basename "$apk")"
            "$apksigner" verify --print-certs "$apk"
          done

      - name: Upload the release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: ${{ steps.collect.outputs.staging }}/*.apk
          if-no-files-found: error

      # Only a tag can be published, so a workflow_dispatch run from a branch stops at the artifact.
      - name: Prepare the release notes
        if: github.ref_type == 'tag'
        id: notes
        env:
          VERSION: ${{ steps.collect.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match AppConfig versionName $VERSION." \
                 "Bump AppConfig or retag."
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          # index(...) == 1 rather than a regex, so the dots in a version aren't wildcards.
          # Stops at the next version heading or at the link-reference block that ends the file,
          # then sed drops the leading blank lines.
          awk -v header="## [$VERSION]" '
            index($0, header) == 1 { capture = 1; next }
            capture && (index($0, "## [") == 1 || /^\[[^]]+\]: /) { exit }
            capture { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no entries under ## [$VERSION]."
            exit 1
          fi
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          cat "$notes"

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.collect.outputs.version }}
        run: |
          set -euo pipefail
          # A tag like v0.2.0-rc.1 publishes as a pre-release.
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            --title "Alarm Me $VERSION" \
            --notes-file "${{ steps.notes.outputs.notes }}" \
            "${prerelease[@]}" \
            "${{ steps.collect.outputs.staging }}"/*.apk
